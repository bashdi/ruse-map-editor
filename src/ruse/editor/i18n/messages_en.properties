file.filter=RUSE maps (*.rusemap)
help.html=<html><body style='width:480px'>\
<h3>What reaches the game</h3>\
<p>R.U.S.E. can only load terrain built by Eugen (mountains, forests, rivers, roads, bridges and towns are \
precompiled). A custom map therefore consists of the <b>terrain of an original map</b> plus what the editor edits:</p>\
<ul>\
<li><b>Starting points</b> – every alliance has starting points in an order. In team games team 1 starts on \
alliance 1, team 2 on alliance 2 … (in that order). In free for all, player n starts on the first starting point \
of alliance n. The editor sets up the start camera.</li>\
<li><b>Supply depots</b> – neutral, with supply (original maps 15–35) and orientation; they snap beside the \
nearest road like in the original maps.</li>\
<li><b>Buildings</b> – neutral bunkers, positions, factories … (in skirmish the game only creates neutral objects).</li>\
<li><b>Town and mountain names</b> – labels on the map; known names are translated by the game.</li>\
<li><b>Map selection</b> – name, number of players and enabled modes (2/3/4 teams, free for all).</li>\
</ul>\
<h3>Usage</h3>\
<p>Mouse wheel = zoom, right/middle mouse button or space + drag = pan, Ctrl+0 = fit. \
Tools: 1 select, S starting point, D depot, G building, C town name, B mountain name. Q/E rotate, Del deletes. \
On the right under <i>Display</i>, “Assignment: …” shows which player starts where in each mode. \
Ctrl+G shows the layout of the original map, Ctrl+R toggles the roads.</p>\
<p><b>Game → Add to game</b> (Ctrl+Shift+I) writes the map into the game; the original files are backed up \
first and can be restored under <i>Custom maps in game</i>.</p>\
</body></html>

