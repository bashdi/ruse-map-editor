file.filter=RUSE-Karten (*.rusemap)
help.html=<html><body style='width:480px'>\
<h3>Was ins Spiel übernommen wird</h3>\
<p>R.U.S.E. kann nur Gelände laden, das Eugen gebaut hat (Berge, Wälder, Flüsse, Straßen, Brücken und Orte sind \
fertig berechnet). Eine eigene Karte besteht deshalb aus dem <b>Gelände einer Originalkarte</b> und dem, was der \
Editor bearbeitet:</p>\
<ul>\
<li><b>Startplätze</b> – jedes Bündnis hat Startplätze in einer Reihenfolge. Im Teamspiel startet Team 1 auf \
Bündnis 1, Team 2 auf Bündnis 2 … (in der Reihenfolge). Bei Jeder-gegen-jeden startet Spieler n auf dem ersten \
Startplatz von Bündnis n. Die Kamera beim Start richtet der Editor aus.</li>\
<li><b>Nachschubdepots</b> – neutral, mit Vorrat (Originalkarten 15–35) und Ausrichtung; sie rasten wie in den \
Originalkarten neben der nächsten Straße ein.</li>\
<li><b>Gebäude</b> – neutrale Bunker, Stellungen, Fabriken … (im Gefecht erzeugt das Spiel nur neutrale Objekte).</li>\
<li><b>Stadt- und Bergnamen</b> – Beschriftungen auf der Karte; bekannte Namen übersetzt das Spiel.</li>\
<li><b>Kartenauswahl</b> – Name, Spielerzahl und freigegebene Modi (2/3/4 Teams, Jeder gegen jeden).</li>\
</ul>\
<h3>Bedienung</h3>\
<p>Mausrad = Zoom, rechte/mittlere Maustaste oder Leertaste + Ziehen = verschieben, Strg+0 = einpassen. \
Werkzeuge: 1 Auswählen, S Startplatz, D Depot, G Gebäude, C Stadtname, B Bergname. Q/E drehen, Entf löscht. \
Rechts unter <i>Anzeige</i> zeigt „Belegung: …“, welcher Spieler in welchem Modus wo startet. \
Strg+G blendet die Belegung der Originalkarte ein, Strg+R die Straßen.</p>\
<p><b>Spiel → Ins Spiel einfügen</b> (Strg+Umschalt+I) schreibt die Karte ins Spiel; die Originaldateien werden \
vorher gesichert und lassen sich unter <i>Eigene Karten im Spiel</i> wiederherstellen.</p>\
</body></html>

